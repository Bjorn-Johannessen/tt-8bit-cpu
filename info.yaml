# Tiny Tapeout project information
project:
  title:        "8-bit Accumulator CPU"      # Project title
  author:       "Bjorn Johannessen"      # Your name
  discord:      "bj_idk"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "A simple 8-bit accumulator CPU with external memory"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     1000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_bjorn_johannessen_cpu8"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DATA_IN[0]"
  ui[1]: "DATA_IN[1]"
  ui[2]: "DATA_IN[2]"
  ui[3]: "DATA_IN[3]"
  ui[4]: "DATA_IN[4]"
  ui[5]: "DATA_IN[5]"
  ui[6]: "DATA_IN[6]"
  ui[7]: "DATA_IN[7]"

  # Outputs
  uo[0]: "ADDR[0]"
  uo[1]: "ADDR[1]"
  uo[2]: "ADDR[2]"
  uo[3]: "ADDR[3]"
  uo[4]: "ADDR[4]"
  uo[5]: "ADDR[5]"
  uo[6]: "ADDR[6]"
  uo[7]: "ADDR[7]"

  # Bidirectional pins
  uio[0]: "DATA_OUT[0]"
  uio[1]: "DATA_OUT[1]"
  uio[2]: "DATA_OUT[2]"
  uio[3]: "DATA_OUT[3]"
  uio[4]: "DATA_OUT[4]"
  uio[5]: "DATA_OUT[5]"
  uio[6]: "DATA_OUT[6]"
  uio[7]: "DATA_OUT[7]"

# Do not change!
yaml_version: 6
